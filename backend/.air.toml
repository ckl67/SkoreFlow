#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp/air"

[build]
args_bin = []
bin = "./tmp/air/main"
cmd = "sh -c 'go build -ldflags \"-X main.Version=$VERSION -X main.Commit=$COMMIT -X main.BuildDate=$BUILD_DATE\" -o ./tmp/air/main ./cmd/server'"
log = "tmp/air/build-errors.log"
delay = 1000
entrypoint = ["./tmp/air/main"]
exclude_dir = ["assets", "tmp", "vendor", "testdata", "storage"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
ignore_dangerous_root_dir = false
include_dir = []
include_ext = ["go", "tpl", "tmpl", "html"]
include_file = []
kill_delay = "0s"
poll = false
poll_interval = 0
post_cmd = []
# Whenever Air detects a change to a .go file, it will run this pre_cmd before restarting the compilation cmd.
# npm run vmbc:
#  "vmbc": "RESET_DB_STORAGE=1 npm run clean-backend && npm run test:backend",
#     clean-backend cleans the database/storage on start-up.
#     RESET_DB_STORAGE=1 is passed to the Air process.
#     Whenever the code is modified, Air triggers pre_cmd, which runs 'make cleandb-storage' before recompiling and restarting the server.

pre_cmd = [
  "sh -c 'if [ \"$RESET_DB_STORAGE\" = \"1\" ]; then make cleandb-storage; fi'",
]
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
app_start_timeout = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
